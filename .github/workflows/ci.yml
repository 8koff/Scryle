name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI never needs to write to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs so a moved tag can't change what runs. Dependabot updates them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck and test
        run: npx turbo run typecheck test
      - name: Lint
        working-directory: apps/web
        run: npx eslint app components lib proxy.ts
      # No secrets here on purpose: the build must work without them, and pull requests from forks never get them.
      - name: Build
        working-directory: apps/web
        run: npx next build
